{% extends "admin/change_list.html" %} {% load static %} {% block extrahead %}
{{ block.super }}

<!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->

<!-- <script src="{% static 'app_news/chart.js/Chart.bundle.min.js' %}"></script> -->

<script src="{% static 'app_news/chart.js/chart.umd.js' %}"></script>

{% endblock %} {% block content %}
<!-- Передаем данные из Django через встроенный безопасный тег json_script -->
{{ analytics_json|json_script:"analytics-data" }}

<!-- Сетка для графиков -->
<div
  style="
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 30px;
  "
>
  <div
    style="
      background: white;
      padding: 15px;
      border-radius: 4px;
      border: 1px solid #ccc;
      height: 300px;
    "
  >
    <canvas id="growthChart"></canvas>
  </div>
  <div
    style="
      background: white;
      padding: 15px;
      border-radius: 4px;
      border: 1px solid #ccc;
      height: 300px;
    "
  >
    <canvas id="lifecycleChart"></canvas>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Безопасно вытаскиваем JSON из тега скрипта по его ID
    const dataElement = document.getElementById("analytics-data");
    if (!dataElement) return;

    const analyticsData = JSON.parse(dataElement.textContent);

    // Инициализация Графика 1: Динамика
    new Chart(document.getElementById("growthChart"), {
      type: "line",
      data: {
        labels: analyticsData.months || [],
        datasets: [
          {
            label: "Новые подписчики",
            data: analyticsData.joined || [],
            borderColor: "#28a745",
            backgroundColor: "rgba(40, 167, 69, 0.1)",
            tension: 0.3,
            fill: true,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { title: { display: true, text: "Динамика прироста базы" } },
      },
    });

    // Инициализация Графика 2: Срок подписки
    new Chart(document.getElementById("lifecycleChart"), {
      type: "bar",
      data: {
        labels: ["Средний срок до отписки"],
        datasets: [
          {
            label: "Количество дней",
            data: [analyticsData.avg_lifetime_days || 0],
            backgroundColor: "#007bff",
            borderWidth: 1,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: "Жизненный цикл (Churn Metric)" },
        },
        scales: { y: { beginAtZero: true } },
      },
    });
  });
</script>

{{ block.super }} {% endblock %}
